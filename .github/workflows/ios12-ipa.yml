name: Nuvio Legacy iOS 12 IPA
on:
  workflow_dispatch:
  push:
    branches: [ios12-legacy]
    paths:
      - 'legacy-ios12/**'
      - '.github/workflows/ios12-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen ldid
      - name: Generate Xcode project
        working-directory: legacy-ios12
        run: xcodegen generate
      - name: Build for physical iOS device
        working-directory: legacy-ios12
        run: |
          xcodebuild -project NuvioLegacy.xcodeproj -scheme NuvioLegacy \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Validate minimum iOS and architecture
        run: |
          set -euo pipefail
          APP="legacy-ios12/build/Build/Products/Release-iphoneos/NuvioLegacy.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "0.1.2"
          xcrun lipo -archs "$APP/NuvioLegacy" | grep -qw arm64
      - name: Apply jailbreak ad-hoc signature with ldid
        run: |
          set -euo pipefail
          APP="legacy-ios12/build/Build/Products/Release-iphoneos/NuvioLegacy.app"
          ldid -Slegacy-ios12/Legacy.entitlements "$APP/NuvioLegacy"
          ldid -e "$APP/NuvioLegacy" > /tmp/nuvio-entitlements.xml
          plutil -lint /tmp/nuvio-entitlements.xml
          grep -q 'application-identifier' /tmp/nuvio-entitlements.xml
          grep -q 'com.emanuelcnjunior.nuviolegacy' /tmp/nuvio-entitlements.xml
      - name: Package jailbreak IPA
        run: |
          set -euo pipefail
          mkdir -p output/Payload
          cp -R legacy-ios12/build/Build/Products/Release-iphoneos/NuvioLegacy.app output/Payload/
          cd output
          zip -qry ../NuvioLegacy-v0.1.2-iOS12-jailbreak.ipa Payload
      - name: Publish versioned IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="ios12-v0.1.2-build.${RUN_NUMBER}"
          gh release create "$TAG" NuvioLegacy-v0.1.2-iOS12-jailbreak.ipa \
            --target "$GITHUB_SHA" \
            --title "Nuvio Legacy 0.1.2 (iOS 12) - Build ${RUN_NUMBER}" \
            --notes "Build experimental para iOS 12.5.8 / iPad Air 1 com jailbreak. IPA com assinatura ad-hoc ldid; requer ambiente de jailbreak que aceite esse tipo de assinatura. Esta versão inicial oferece reprodução básica MP4/HLS." \
            --prerelease
