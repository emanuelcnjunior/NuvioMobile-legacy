name: Nuvio Legacy iOS 12 IPA
on:
  workflow_dispatch:
  push:
    branches: [ios12-legacy]
    paths:
      - 'legacy-ios12/**'
      - '.github/workflows/ios12-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: legacy-ios12
        run: xcodegen generate
      - name: Build for physical iOS device (unsigned)
        working-directory: legacy-ios12
        run: |
          xcodebuild -project NuvioLegacy.xcodeproj -scheme NuvioLegacy \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Verify minimum OS and device architecture
        run: |
          APP="legacy-ios12/build/Build/Products/Release-iphoneos/NuvioLegacy.app"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          xcrun lipo -archs "$APP/NuvioLegacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "12.0"
      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R legacy-ios12/build/Build/Products/Release-iphoneos/NuvioLegacy.app output/Payload/
          cd output
          zip -qry ../NuvioLegacy-iOS12-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioLegacy-iOS12-unsigned
          path: NuvioLegacy-iOS12-unsigned.ipa
          retention-days: 30
